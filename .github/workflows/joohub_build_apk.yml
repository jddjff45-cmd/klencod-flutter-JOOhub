name: JOOhub Cloud APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Gradle 9.3.1 & Permissions
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joohub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Direct APK Release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "JOOhub v10.0 — Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
