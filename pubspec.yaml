name: joohub
description: "JOOhub — Mobile Flutter IDE, Full-Power AI Studio, Full GitHub Control & Background APK Builder"
publish_to: 'none'
version: 10.0.0+10

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  http: ^1.2.2
  archive: ^3.6.1
  intl: any
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
